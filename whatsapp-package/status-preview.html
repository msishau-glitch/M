<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wedding Status</title>
    <style>
      :root {
        --ivory: #f7f1ea;
        --gold: #c7a76a;
        --burgundy: #5a1f2a;
        --text: #2b1f1d;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #f9f5f1 0%, #f1e8e4 100%);
        font-family: Arial, sans-serif;
      }

      .status-card {
        position: relative;
        width: 1080px;
        height: 1920px;
        background: linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0.08)), var(--ivory);
        border: 2px solid rgba(199,167,106,0.42);
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .status-card::before,
      .status-card::after {
        content: "";
        position: absolute;
        width: 220px;
        height: 220px;
        border: 1px solid rgba(199,167,106,0.55);
        border-radius: 50%;
        top: 80px;
      }

      .status-card::before { left: -70px; }
      .status-card::after { right: -70px; }

      .content {
        text-align: center;
        position: relative;
        z-index: 1;
        padding: 0 80px;
      }

      .eyebrow {
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--burgundy);
        font-size: 36px;
        font-weight: 700;
        margin-bottom: 42px;
      }

      h1 {
        margin: 0;
        color: var(--burgundy);
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 126px;
        line-height: 0.96;
        letter-spacing: 0.06em;
        font-weight: 600;
      }

      h1 .ampersand {
        color: var(--gold);
        font-size: 90px;
        display: block;
        margin: 18px 0;
      }

      .date {
        margin-top: 54px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: 36px;
        color: var(--text);
        font-weight: 700;
      }

      .invite {
        margin-top: 74px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--gold);
        font-size: 30px;
        font-weight: 700;
      }

      .cta {
        margin-top: 36px;
        color: var(--burgundy);
        font-size: 26px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="status-card">
      <div class="content">
        <div class="eyebrow">Wedding Invitation</div>
        <h1>
          <span>MUTAKULWA MUBITA</span>
          <span class="ampersand">&amp;</span>
          <span>ROBERT SINGOGO</span>
        </h1>
        <div class="date">30 OCTOBER 2026</div>
        <div class="invite">You are invited</div>
        <div class="cta">Open the full invitation</div>
      </div>
    </div>
  </body>
</html>
